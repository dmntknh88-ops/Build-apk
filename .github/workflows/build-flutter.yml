name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID'
        required: true
        type: string
      userId:
        description: 'User ID'
        required: true
        type: string
      payload:
        description: 'JSON payload (zipAssetUrl, appName, packageName, etc)'
        required: true
        type: string

env:
  JAVA_VERSION: '17'
  FLUTTER_VERSION: '3.24.5'
  ANDROID_API: '34'
  BUILD_TOOLS: '34.0.0'

jobs:
  build:
    name: Flutter Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse payload
        id: meta
        shell: bash
        run: |
          set -e
          PAYLOAD='${{ inputs.payload }}'
          echo "$PAYLOAD" > /tmp/payload.json
          python3 - <<'PY'
          import json, os
          p = json.load(open('/tmp/payload.json'))
          def out(k, v):
              v = '' if v is None else str(v)
              # multiline safe
              print(f'{k}={v}')
          out('zip_url', p.get('zipAssetUrl') or p.get('zip_url') or '')
          out('app_name', p.get('appName') or p.get('app_name') or 'MyApp')
          out('package_name', p.get('packageName') or p.get('package_name') or 'com.example.app')
          out('release_tag', p.get('zipReleaseTag') or p.get('release_tag') or '')
          PY
          while IFS='=' read -r k v; do
            echo "$k=$v" >> $GITHUB_OUTPUT
          done < <(python3 - <<'PY'
          import json
          p = json.load(open('/tmp/payload.json'))
          print('zip_url=' + (p.get('zipAssetUrl') or p.get('zip_url') or ''))
          print('app_name=' + (p.get('appName') or p.get('app_name') or 'MyApp'))
          print('package_name=' + (p.get('packageName') or p.get('package_name') or 'com.example.app'))
          print('release_tag=' + (p.get('zipReleaseTag') or p.get('release_tag') or ''))
          PY
          )
          echo "job_id=${{ inputs.jobId }}" >> $GITHUB_OUTPUT
          echo "Payload parsed for job ${{ inputs.jobId }}"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-${{ env.ANDROID_API }}" "build-tools;${{ env.BUILD_TOOLS }}"
          yes | sdkmanager --licenses || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Download project ZIP from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP_URL: ${{ steps.meta.outputs.zip_url }}
        run: |
          set -e
          mkdir -p project_src
          if [ -z "$ZIP_URL" ]; then
            echo "ERROR: zipAssetUrl kosong di payload"
            exit 1
          fi
          echo "Downloading project ZIP..."
          # API asset URL needs Accept + token
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -o project.zip \
            "$ZIP_URL"
          SIZE=$(stat -c%s project.zip)
          echo "Downloaded $SIZE bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "ZIP terlalu kecil / gagal download"
            head -c 500 project.zip || true
            exit 1
          fi
          unzip -q project.zip -d project_src
          # Flatten if single root folder
          if [ $(find project_src -mindepth 1 -maxdepth 1 -type d | wc -l) -eq 1 ] && [ $(find project_src -mindepth 1 -maxdepth 1 -type f | wc -l) -eq 0 ]; then
            ROOT=$(find project_src -mindepth 1 -maxdepth 1 -type d | head -1)
            mv "$ROOT"/* project_src/ 2>/dev/null || true
            mv "$ROOT"/.* project_src/ 2>/dev/null || true
            rmdir "$ROOT" 2>/dev/null || true
          fi
          ls -la project_src | head -30

      - name: Locate Flutter project
        id: proj
        run: |
          set -e
          if [ -f project_src/pubspec.yaml ]; then
            echo "dir=project_src" >> $GITHUB_OUTPUT
          else
            FOUND=$(find project_src -name pubspec.yaml -type f | head -1)
            if [ -z "$FOUND" ]; then
              echo "pubspec.yaml tidak ditemukan"
              find project_src -maxdepth 3 -type f | head -50
              exit 1
            fi
            DIR=$(dirname "$FOUND")
            echo "dir=$DIR" >> $GITHUB_OUTPUT
          fi
          echo "Project dir: $(cat $GITHUB_OUTPUT | grep dir=)"

      - name: Flutter pub get
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          flutter config --no-analytics
          flutter pub get

      - name: Build APK (release)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          flutter build apk --release
          APK=$(find build/app/outputs/flutter-apk -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan setelah build"
            find build -name '*.apk' || true
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/app-release.apk"
          ls -lh "$GITHUB_WORKSPACE/app-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: app-release.apk
          if-no-files-found: error
          retention-days: 2
